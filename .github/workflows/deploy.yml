name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the app exists
        id: app
        run: if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: 22
      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm ci && npm run build -- --base=/tiny-todo/
      - uses: actions/configure-pages@v5
        if: steps.app.outputs.exists == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.app.outputs.exists == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.app.outputs.exists == 'true'
        uses: actions/deploy-pages@v4
