name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        run: |
          if [ ! -f package.json ]; then echo "No app yet"; exit 0; fi
          npm ci
          npm test
          npm run build
